[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-disclosures-pipeline"
version = "0.1.0"
description = "Standalone pipeline for preparing and harmonizing iOS privacy labels and Android safety forms."
requires-python = ">=3.9.6"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
